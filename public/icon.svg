<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    PITCHWORK'S MARK — the halfway line and the centre circle, the two strokes every
    pitch in the world has in common. Same drawing as <Mark> in PitchArt.tsx; if one
    changes, change both.

    Drawn full-bleed inside the 512 box with the circle at 40% of the width, which
    keeps it inside the safe zone Android crops for a maskable icon (the outer ~10%
    on every side can be cut away).
  -->
  <defs>
    <linearGradient id="turf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f9463"/>
      <stop offset="55%" stop-color="#14392a"/>
      <stop offset="100%" stop-color="#0a1c14"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#turf)"/>

  <!-- mow stripes, the same texture the app's background carries -->
  <g opacity="0.10">
    <rect x="0" y="0" width="512" height="512" fill="none"/>
    <g fill="#ffffff">
      <rect x="-64" y="0" width="72" height="512" transform="rotate(18 256 256)"/>
      <rect x="80" y="0" width="72" height="512" transform="rotate(18 256 256)"/>
      <rect x="224" y="0" width="72" height="512" transform="rotate(18 256 256)"/>
      <rect x="368" y="0" width="72" height="512" transform="rotate(18 256 256)"/>
    </g>
  </g>

  <line x1="256" y1="40" x2="256" y2="472" stroke="rgba(255,255,255,0.88)" stroke-width="22"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="26"/>
  <circle cx="256" cy="256" r="38" fill="#d8e64a"/>
</svg>
